name: Release OSS (APK)

on:
  push:
    tags:
      - v*

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Dummy files
        id: dummy_files
        run: |
          mkdir -p /home/runner/work/GitSync/GitSync/build/app/outputs/flutter-apk/;
          cd /home/runner/work/GitSync/GitSync/build/app/outputs/flutter-apk/;
          for apk in app-arm64-v8a-release-signed.apk app-armeabi-v7a-release-signed.apk app-x86_64-release-signed.apk; do
            echo "CONTENTS OF $apk" > $apk;
          done
          echo "RELEASE" > app-arm64-v8a-release.apk

      - name: Sign App
        id: sign_app
        run: echo "signedFiles=/home/runner/work/GitSync/GitSync/build/app/outputs/flutter-apk/app-arm64-v8a-release-signed.apk:/home/runner/work/GitSync/GitSync/build/app/outputs/flutter-apk/app-armeabi-v7a-release-signed.apk:/home/runner/work/GitSync/GitSync/build/app/outputs/flutter-apk/app-x86_64-release-signed.apk" >> "$GITHUB_OUTPUT"

      - name: Manual Split one variable
        id: signed_files
        run: |
          {
            echo "signedFiles<<SIGNED_FILES_EOF_DELIMETER"
            echo "${{ steps.sign_app.outputs.signedFiles }}" | sed 's/:/\n/g'
            echo "SIGNED_FILES_EOF_DELIMETER"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Release Build to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            ${{ steps.signed_files.outputs.signedFiles }}
            !*-release.apk